<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your Engagement Center — Engage</title>
<style>
:root{
  --white:#ffffff; --black:#1e242e;
  --grey-50:#fafafa; --grey-100:#ebecef; --grey-200:#d5d7dd; --grey-300:#c7cad1;
  --grey-400:#b3b8c1; --grey-500:#6e7686; --grey-600:#5c6370; --grey-900:#22252a;
  --coral-500:#ff9780; --green-50:#e9fbf5; --green-100:#bbf2e1; --green-500:#32c898; --green-800:#147656;
  --red-50:#ffecef; --red-700:#d90b28; --orange-50:#fff5ee; --orange-100:#ffe0cb; --orange-800:#a94f13;
  --purple-50:#f1ecff; --purple-100:#dad0ff; --purple-200:#c4b7ff; --purple-300:#b7a7ff;
  --purple-500:#7e55f6; --purple-700:#683fcf; --purple-800:#4c3c9d;
  --blue-50:#f5f9ff; --blue-100:#d8e9fd; --blue-900:#073c85;
  --teal-50:#e8f5f8; --teal-800:#0b5665;
  --content-neutral-default:var(--black); --content-neutral-secondary:var(--grey-600);
  --content-neutral-tertiary:var(--grey-500); --content-accent-default:var(--purple-700);
  --content-success-default:var(--green-800);
  --border-neutral-default:rgba(0,0,0,.08);
  --elevation-neutral-bg:var(--grey-50); --surface-neutral-secondary:var(--grey-100);
  --surface-accent-default:var(--purple-50); --ai-gradient:#7d19f0;
  --xxxs:4px; --xxs:6px; --xs:8px; --sm:12px; --md:16px; --lg:24px; --xl:32px; --xxl:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;color:var(--content-neutral-default);
  background:var(--elevation-neutral-bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--content-accent-default)}

.h-xxl{font-size:24px;font-weight:600;letter-spacing:-.01em}
.h-lg{font-size:18px;font-weight:600}.h-md{font-size:16px;font-weight:600}
.t-sm{font-size:12px}.t-xs{font-size:10px}
.med{font-weight:500}.bold{font-weight:600}
.sec{color:var(--content-neutral-secondary)}.ter{color:var(--content-neutral-tertiary)}
.acc{color:var(--content-accent-default)}
.row{display:flex;align-items:center;gap:var(--xs)}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.gap-xxxs{gap:var(--xxxs)}.gap-xxs{gap:var(--xxs)}.gap-xs{gap:var(--xs)}
.gap-sm{gap:var(--sm)}.gap-md{gap:var(--md)}
.hidden{display:none !important}

.app{display:flex;height:100vh;padding:var(--xs);gap:var(--xs)}
.main{flex:1;min-width:0;background:var(--white);border:1px solid var(--border-neutral-default);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.side{width:352px;flex-shrink:0;background:var(--white);border:1px solid var(--border-neutral-default);
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:1000px){.side{display:none}}

.top{padding:var(--md) var(--lg);border-bottom:1px solid var(--border-neutral-default);
  display:flex;align-items:center;gap:var(--sm)}
.logo{width:28px;height:28px;border-radius:var(--xs);background:var(--black);color:var(--coral-500);
  display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.progress{flex:1;height:5px;border-radius:3px;background:var(--grey-100);overflow:hidden;max-width:320px}
.progress > span{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--ai-gradient),var(--purple-500));transition:width .4s cubic-bezier(.32,.72,0,1)}

.thread{flex:1;overflow-y:auto;padding:var(--lg);display:flex;flex-direction:column;gap:var(--md)}
.turn{display:flex;gap:var(--sm);align-items:flex-start;max-width:760px;
  animation:rise .32s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.av{width:28px;height:28px;border-radius:var(--xs);flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--ai-gradient),var(--purple-500))}
.ask{background:var(--white);border:1px solid var(--purple-100);border-radius:14px;border-top-left-radius:4px;
  padding:var(--sm) var(--md)}
.said{align-self:flex-end;max-width:78%;background:var(--surface-neutral-secondary);border-radius:14px;
  border-bottom-right-radius:4px;padding:var(--sm) var(--md);animation:rise .28s cubic-bezier(.32,.72,0,1) both}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--grey-300);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

.compose{border-top:1px solid var(--border-neutral-default);padding:var(--md) var(--lg);
  display:flex;flex-direction:column;gap:var(--sm);background:var(--white)}
.chips{display:flex;gap:var(--xxs);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:var(--xxs);padding:7px 12px;border-radius:999px;
  font-size:13px;font-weight:500;border:1px solid var(--border-neutral-default);background:var(--white);
  color:var(--content-neutral-secondary)}
.chip:hover{background:var(--surface-accent-default);border-color:var(--purple-200);color:var(--content-accent-default)}
.chip.on{background:var(--black);color:var(--white);border-color:var(--black)}
.chip.recommended{border-color:var(--purple-200);background:var(--surface-accent-default);color:var(--content-accent-default)}
.chip.recommended:hover{border-color:var(--purple-500)}
.recMark{display:inline-flex;align-items:center;gap:var(--xxxs);font-size:11px;font-weight:600;color:var(--purple-800)}
.inferred{border-color:var(--purple-200);background:linear-gradient(140deg,var(--purple-50),var(--white) 72%)}
.inputRow{display:flex;gap:var(--xs);align-items:flex-end}
.voiceBtn{width:40px;height:40px;border:1px solid var(--border-neutral-default);border-radius:var(--xs);
  background:var(--white);display:grid;place-items:center;flex-shrink:0;color:var(--content-neutral-secondary)}
.voiceBtn:hover,.voiceBtn.listening{background:var(--surface-accent-default);color:var(--content-accent-default);border-color:var(--purple-200)}
.ta{flex:1;border:1px solid var(--border-neutral-default);border-radius:var(--xs);padding:10px 12px;
  font-size:14px;min-height:44px;max-height:140px;resize:none;line-height:1.5;background:var(--white)}
.ta:focus{outline:2px solid var(--purple-200);border-color:var(--purple-500)}
.btn{display:inline-flex;align-items:center;gap:var(--xxs);height:40px;padding:0 var(--md);
  border-radius:var(--xs);font-size:14px;font-weight:500;white-space:nowrap}
.btn.sm{height:30px;padding:0 var(--sm);font-size:12px}
.btn-primary{background:var(--black);color:var(--white)}
.btn-primary:hover{background:var(--grey-900)}
.btn-secondary{background:var(--white);border:1px solid var(--border-neutral-default)}
.btn-secondary:hover{background:rgba(27,35,50,.03)}
.btn-ai{background:linear-gradient(96deg,var(--ai-gradient),var(--purple-500));color:var(--white)}
.btn[disabled]{opacity:.4;pointer-events:none}

.sideHead{padding:var(--md) var(--lg);border-bottom:1px solid var(--border-neutral-default)}
.sideBody{flex:1;overflow-y:auto;padding:var(--md) var(--lg);display:flex;flex-direction:column;gap:var(--sm)}
.sum{border:1px solid var(--border-neutral-default);border-radius:10px;padding:var(--sm) var(--md);
  display:flex;flex-direction:column;gap:2px;opacity:.45;transition:.3s}
.sum.done{opacity:1;border-color:var(--green-100);background:var(--green-50)}
.sum.now{opacity:1;border-color:var(--purple-200);background:var(--purple-50)}
.sum .k{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--content-neutral-tertiary)}

.card{background:var(--white);border:1px solid var(--border-neutral-default);border-radius:12px;padding:var(--md)}
.tag{display:inline-flex;align-items:center;gap:var(--xxxs);height:20px;padding:0 var(--xxs);
  border-radius:var(--xxs);font-size:11px;font-weight:500}
.tag-grey{background:var(--surface-neutral-secondary);color:var(--content-neutral-secondary)}
.tag-purple{background:var(--purple-50);color:var(--purple-800)}
.tag-green{background:var(--green-50);color:var(--green-800)}
.tag-blue{background:var(--blue-100);color:var(--blue-900)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--xs)}
.kv{display:flex;flex-direction:column;gap:1px}
.kv .k{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--content-neutral-tertiary)}

/* ACE education */
.aceLesson{padding:0;overflow:hidden;border-color:var(--purple-200)}
.aceLessonHead{padding:var(--md);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sm)}
.videoStage{background:var(--black);color:var(--white);padding:var(--md);min-height:230px;display:flex;flex-direction:column;gap:var(--md)}
.videoScene{display:flex;flex-direction:column;gap:var(--sm);flex:1}
.videoKicker{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--purple-200)}
.aceChain{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--xs)}
.aceNode{min-width:0;padding:var(--xs);border:1px solid var(--grey-600);border-radius:var(--xs);opacity:.5;
  display:flex;align-items:center;gap:var(--xxs);transition:transform .25s cubic-bezier(.9,0,0,1),opacity .25s cubic-bezier(.9,0,0,1),border-color .25s cubic-bezier(.9,0,0,1)}
.aceNode.active{opacity:1;border-color:var(--purple-300);transform:translateY(-2px);background:var(--purple-800)}
.aceNode.done{opacity:1;border-color:var(--green-500)}
.aceNodeN{width:20px;height:20px;border-radius:50%;background:var(--grey-600);display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:600}
.aceNode.active .aceNodeN{background:var(--purple-500)}.aceNode.done .aceNodeN{background:var(--green-500)}
.videoControls{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:var(--xs)}
.videoPlay{width:32px;height:32px;border-radius:50%;background:var(--white);color:var(--black);display:grid;place-items:center}
.videoProgress{height:4px;background:var(--grey-600);border-radius:2px;overflow:hidden}
.videoProgress span{display:block;width:0;height:100%;background:var(--purple-300);transition:width .25s linear}
.videoTime{font-size:11px;color:var(--grey-300);font-variant-numeric:tabular-nums}
.modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--xs);padding:var(--md)}
.modeCard{padding:var(--sm);border:1px solid var(--border-neutral-default);border-radius:var(--xs);display:flex;flex-direction:column;gap:var(--xxxs)}
.modeCard.recommended{border-color:var(--purple-200);background:var(--surface-accent-default)}
@media(max-width:720px){.aceChain,.modeGrid{grid-template-columns:1fr}.videoStage{min-height:0}}
@media(prefers-reduced-motion:reduce){.aceNode,.videoProgress span{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="top">
      <div class="logo">G</div>
      <div class="col gap-xxxs" style="flex:1;min-width:0">
        <span class="med">Set up your Engagement Center</span>
        <span class="t-xs ter" id="stepLabel">Reading your connected store…</span>
      </div>
      <div class="progress"><span id="bar" style="width:7%"></span></div>
      <button class="btn btn-secondary sm" id="skip">Skip setup</button>
    </div>

    <div class="thread" id="thread"></div>

    <div class="compose" id="compose">
      <div class="chips" id="chips"></div>
      <div class="inputRow">
        <textarea class="ta" id="say" rows="1" placeholder="Type or speak your answer…"></textarea>
        <button class="voiceBtn" id="voice" title="Answer by voice" aria-label="Answer by voice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
        </button>
        <button class="btn btn-ai" id="send">Send</button>
      </div>
      <span class="t-xs ter" id="hint"></span>
    </div>
  </main>

  <aside class="side">
    <div class="sideHead">
      <span class="h-md">What we're setting up</span>
      <p class="t-sm sec" style="margin-top:2px">Everything here is editable later. Nothing sends until you say so.</p>
    </div>
    <div class="sideBody" id="summary"></div>
  </aside>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const SPARK=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="m6.6 6.6 2.8 2.8M14.6 14.6l2.8 2.8M17.4 6.6l-2.8 2.8M9.4 14.6l-2.8 2.8"/></svg>`;

const STORE_PROFILE={label:"Store profile",sum:"Technical outdoor apparel · seasonal, fit-sensitive"};
function storeProfileCard(){return `<div class="card inferred">
  <div class="row between wrap gap-xs" style="margin-bottom:var(--xs)">
    <div class="col gap-xxxs"><span class="h-md">What I already understand</span>
      <span class="t-sm sec">Inferred from your catalogue, orders and support conversations.</span></div>
    <span class="tag tag-purple">AI inferred</span>
  </div>
  <div class="grid2">
    ${[["Business","Technical outdoor apparel"],["Core products","Hardshells, mid-layers, tights"],
       ["Buying pattern","Considered purchases for a specific trip"],["Seasonality","Cold-weather peaks and seasonal returns"],
       ["Main friction","Fit, sizing and product compatibility"],["Best first lever","Expert help before discounts"]]
      .map(x=>`<div class="kv"><span class="k">${x[0]}</span><span class="t-sm med">${x[1]}</span></div>`).join("")}
  </div>
  <div class="row gap-xs wrap" style="margin-top:var(--sm)">
    <span class="tag tag-green"><span class="dot" style="background:var(--green-500)"></span>Shopify connected</span>
    <span class="tag tag-green"><span class="dot" style="background:var(--green-500)"></span>Gorgias connected</span>
    <span class="tag tag-grey">18 months analysed</span>
  </div>
  <p class="t-sm ter" style="margin-top:var(--xs)">You can correct any of this later. I won't ask you to repeat information your systems already contain.</p>
</div>`}

function aceEducation(){
  const chain=[["Observe","Orders, tickets, catalogue"],["Find the moment","A useful reason to talk"],
    ["Decide","Who, when and why"],["Write","One-to-one conversation"],
    ["Check","Consent and guardrails"],["Send or wait","Based on your mode"]];
  return `<div class="card aceLesson" id="aceLesson">
    <div class="aceLessonHead">
      <div class="col gap-xxxs"><span class="h-md">How ACE works</span>
        <span class="t-sm sec">A decision engine, not a campaign generator.</span></div>
      <span class="tag tag-purple">1:12 overview</span>
    </div>
    <div class="videoStage">
      <div class="videoScene">
        <span class="videoKicker">A real decision, end to end</span>
        <span class="h-md" id="aceVideoTitle">See how ACE turns a signal into a safe conversation.</span>
        <div class="aceChain">
          ${chain.map((x,i)=>`<div class="aceNode" data-ace-node="${i}"><span class="aceNodeN">${i+1}</span>
            <div class="col gap-xxxs" style="min-width:0"><span class="t-sm med">${x[0]}</span><span class="t-xs" style="color:var(--grey-300)">${x[1]}</span></div></div>`).join("")}
        </div>
      </div>
      <div class="videoControls">
        <button class="videoPlay" data-ace-video aria-label="Play ACE overview" title="Play ACE overview">
          <svg data-ace-video-icon width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.2v11.6L13 8z"/></svg>
        </button>
        <div class="videoProgress" aria-hidden="true"><span id="aceVideoProgress"></span></div>
        <span class="videoTime" id="aceVideoTime">0:00 / 1:12</span>
      </div>
    </div>
    <div class="modeGrid">
      <div class="modeCard recommended"><div class="row between gap-xxs"><span class="t-sm bold">Manual</span><span class="tag tag-purple">Recommended</span></div>
        <span class="t-xs sec">ACE does all six steps, then the message waits in Conversations for approval.</span></div>
      <div class="modeCard"><span class="t-sm bold">Automatic</span>
        <span class="t-xs sec">ACE sends after every guardrail passes. The reasoning remains visible and auditable.</span></div>
      <div class="modeCard"><span class="t-sm bold">Off</span>
        <span class="t-xs sec">ACE does not look for opportunities or prepare conversations.</span></div>
    </div>
  </div>`;
}

/* Each step asks one thing. `card` is what the assistant shows after you answer —
   the read-back that makes the answer concrete. */
const STEPS=[
  {k:"voice", label:"Brand voice",
   ask:"I've analysed 12,400 support conversations and drafted the voice below. The strongest pattern is warm, direct expertise: your best agents solve the problem before they sell.<br><br>Which direction should I use as the starting point?",
   hint:"Recommended from your highest-CSAT conversations. This becomes the skill underneath every message.",
   chips:["Use the detected voice","Make it more expert and precise","Make it more playful and informal"],recommended:0,
   answer:"Warm and direct, never pushy. We use \"we\", British spelling, and we never oversell. If someone has a problem, we fix it before we sell anything.",
   ack:"I'll use the detected voice. If a shopper raises a problem mid-conversation, the agent stops selling and hands off — that behaviour came through consistently in your best conversations.",
   card:()=>`<div class="card"><span class="h-md">Brand skill</span>
     <p class="t-sm sec" style="margin:var(--xxs) 0 var(--sm)">Applied to every message, from every source.</p>
     <div class="col gap-xxs">
       ${[["Tone","Warm and direct, never pushy"],["Voice","First person plural, British spelling"],
          ["Hard rule","Answer a problem before selling anything"],["Sign-off","Rosa, your agent persona"]]
         .map(x=>`<div class="row between"><span class="t-sm sec">${x[0]}</span><span class="t-sm med">${x[1]}</span></div>`).join("")}
     </div></div>`,
   sum:["Brand voice","Warm and direct · problems before sales"]},

  {k:"lifecycle", label:"Lifecycle",
   ask:"I've read your order history and worked out what your customer journey actually looks like. Have a look — does this match how you think about your customers?",
   hint:"Recommended because these seven stages explain 94% of the repeat-purchase patterns in your data.",
   chips:["Use the computed lifecycle","Merge Repeat and VIP","Our VIP bar is higher"],recommended:0,
   answer:"That's right — though our VIP bar feels a bit low. Make it 5 orders, not 4.",
   ack:"Done, VIP starts at 5 orders. One thing worth knowing: your median time to a second order is 62 days, and nothing you run today touches days 48 to 58. That's the biggest gap in your lifecycle.",
   card:()=>`<div class="card"><span class="h-md">Your lifecycle, computed</span>
     <p class="t-sm sec" style="margin:var(--xxs) 0 var(--sm)">Recomputed nightly from orders, sessions and tickets.</p>
     <div class="col gap-xxs">
       ${[["Visitor","18,400","No opt-in"],["Lead","6,120","Opted in, no order"],
          ["First-time buyer","9,840","1 order · 62 days to the next"],["Repeat","4,270","2–4 orders"],
          ["VIP","1,180","5+ orders"],["At risk","2,910","1.5× past their own rhythm"],
          ["Dormant","7,650","No order in 180 days"]]
         .map(x=>`<div class="row between gap-xs">
           <span class="t-sm med" style="min-width:104px">${x[0]}</span>
           <span class="t-sm num" style="font-variant-numeric:tabular-nums">${x[1]}</span>
           <span class="t-sm ter" style="flex:1;text-align:right">${x[2]}</span></div>`).join("")}
     </div></div>`,
   sum:["Lifecycle","7 stages · VIP at 5+ orders"]},

  {k:"guardrails", label:"Guardrails",
   ask:"Now the limits. These are hard — no skill can talk its way past them. Three questions:<br><br>How often is too often, when should we stay quiet, and how much are you willing to discount?",
   hint:"Recommended from your current opt-out rate, order cadence and the safest peer benchmark.",
   chips:["Use the recommended limits","Tighter — 2 a week","No discounts at all"],recommended:0,
   answer:"Those defaults are fine, but cap the discount at 10% and never within two weeks of a full-price order.",
   ack:"Set. And because discount is expensive, I'll reach for cheaper levers first — answering the objection, then early access, then points, then free shipping. Discount is last.",
   card:()=>`<div class="card"><span class="h-md">Guardrails</span>
     <p class="t-sm sec" style="margin:var(--xxs) 0 var(--sm)">Checked last, on every single message.</p>
     <div class="col gap-xxs">
       ${[["Frequency","3 per week · 8 per month"],["Minimum gap","48 hours"],
          ["Quiet hours","21:00–09:00, shopper's timezone"],["Discount ceiling","10% without approval"],
          ["Discount cool-off","14 days after a full-price order"],["Holdout","10%, never messaged"]]
         .map(x=>`<div class="row between"><span class="t-sm sec">${x[0]}</span><span class="t-sm med">${x[1]}</span></div>`).join("")}
     </div>
     <div class="row gap-xxs wrap" style="margin-top:var(--sm)">
       <span class="tag tag-grey">1 · Objection</span><span class="tag tag-purple">2 · Early access</span>
       <span class="tag tag-purple">3 · Points</span><span class="tag tag-blue">4 · Free shipping</span>
       <span class="tag tag-grey" style="background:var(--orange-50);color:var(--orange-800)">5 · Discount</span>
     </div></div>`,
   sum:["Guardrails","3/week · quiet 21–09 · discount ≤10%"]},

  {k:"exclusions", label:"Who to leave alone",
   ask:"Separately from timing: is there anyone we should never contact at all?<br><br>I'd suggest anyone who left you a poor review, anyone who rated a support conversation badly, and anyone in an open dispute. Selling to those people costs you more than it earns.",
   hint:"Recommended because these groups have negative expected value and high complaint risk.",
   chips:["Use all detected exclusions","Add: heavy returners","Just disputes"],recommended:0,
   answer:"All three, yes. And add anyone who's returned more than half of what they bought — that's a fit problem, not a demand problem.",
   ack:"Agreed, and that's a good instinct. That's 4,180 shoppers out of every audience from now on.",
   card:()=>`<div class="card"><span class="h-md">Never contacted</span>
     <div class="col gap-xxs" style="margin-top:var(--xs)">
       ${[["Review of 3★ or less","640"],["Support rating of 1 or 2","310"],["Open dispute","48"],
          ["Asked us to stop, in words","1,290"],["Returned over half their orders","210"],
          ["Do-not-market flag","1,380"]]
         .map(x=>`<div class="row between"><span class="t-sm sec">${x[0]}</span><span class="t-sm med">${x[1]}</span></div>`).join("")}
     </div>
     <div class="row between" style="margin-top:var(--sm);padding-top:var(--xs);border-top:1px solid var(--border-neutral-default)">
       <span class="t-sm bold">Total excluded</span><span class="t-sm bold">4,180 shoppers</span></div></div>`,
   sum:["Exclusions","4,180 shoppers · bad reviews, low CSAT, disputes"]},

  {k:"loyalty", label:"Loyalty",
   ask:"I found your four-tier loyalty programme — Member, Silver, Gold and Summit — and mapped it to the lifecycle above. Points and early access are cheaper than discounts, and your own results show they work better for at-risk shoppers.<br><br>Should I use loyalty as the first offer lever?",
   hint:"Recommended because free shipping from points converted better than 10% off last quarter and cost $5.60 less per order.",
   chips:["Use loyalty before discounts","Use points only","Don't use loyalty yet"],recommended:0,
   answer:"Yes, four tiers — Member, Silver, Gold, Summit.",
   ack:"Good. I've mapped Gold and Summit onto your VIP stage so \"VIP\" means one thing everywhere. On your at-risk shoppers, free shipping from points beat a 10% discount last quarter — cheaper for you and it converted better.",
   card:()=>`<div class="card"><span class="h-md">Loyalty, mapped</span>
     <div class="col gap-xxs" style="margin-top:var(--xs)">
       ${[["Member","9,420","Lead · First-time buyer"],["Silver","5,610","Repeat"],
          ["Gold","2,730","VIP"],["Summit","1,180","VIP"]]
         .map(x=>`<div class="row between gap-xs"><span class="t-sm med" style="min-width:64px">${x[0]}</span>
           <span class="t-sm" style="font-variant-numeric:tabular-nums">${x[1]}</span>
           <span class="t-sm ter" style="flex:1;text-align:right">→ ${x[2]}</span></div>`).join("")}
     </div>
     <p class="t-sm ter" style="margin-top:var(--sm)">Free shipping from points costs you $6.40. A 10% discount on the same order costs $12.</p></div>`,
   sum:["Loyalty","4 tiers · Gold and Summit map to VIP"]},

  {k:"ace", label:"Autonomy",
   before:aceEducation,
   ask:"Now that you've seen the full decision path, choose where ACE should stop.<br><br>In Manual, it still detects, decides, writes and checks everything — it simply waits for you before sending. In Automatic, a message sends as soon as every guardrail passes.",
   hint:"Recommended for a new setup: inspect the first few dozen decisions, then move to Automatic.",
   chips:["Manual acceptance to start","Automatic, I trust it","Off for now"],recommended:0,
   answer:"Manual acceptance to start. I want to read a few dozen before I let it send.",
   ack:"Sensible. Everything it prepares lands in Conversations with the full reasoning attached, and nothing goes out until you approve it. Switch to Automatic whenever you've seen enough.",
   card:()=>`<div class="card"><div class="row between wrap gap-xs" style="margin-bottom:var(--xs)">
       <span class="h-md">ACE</span><span class="tag tag-blue">Manual acceptance</span></div>
     <p class="t-sm sec" style="margin-bottom:var(--sm)">It does all the work, then waits for you. Six themes on, two off — and every standard engagement you'd otherwise switch on one by one is a play inside one of them.</p>
     <div class="col gap-xxs">
       ${[["Replenishment & reorder",1,3],["Retention & win-back",1,3],["Cross-sell & complements",1,3],
          ["Service recovery",1,3],["Subscriptions",1,4],["Loyalty moments",1,3],
          ["Consideration & browse",0,4],["Seasonal & inventory",0,3]]
         .map(x=>`<div class="row between gap-xs"><span class="t-sm ${x[1]?"":"ter"}">${x[0]}</span>
           <span class="row gap-xxs"><span class="t-xs ter">${x[2]} plays</span>
           <span class="tag ${x[1]?"tag-green":"tag-grey"}">${x[1]?"On":"Off"}</span></span></div>`).join("")}
     </div></div>`,
   sum:["ACE","Manual acceptance · 6 of 8 themes"]}
];

let step=0, said={};
const thread=$("#thread"), chips=$("#chips");

function scroll(){thread.scrollTop=thread.scrollHeight}
function addAsk(html){const t=el("div","turn");
  t.innerHTML=`<span class="av">${SPARK}</span><div class="ask">${html}</div>`;
  thread.appendChild(t);scroll();return t}
function addAssistantCard(html,wide=false){const t=el("div","turn");
  t.innerHTML=`<span class="av" style="opacity:0"></span><div style="flex:1;max-width:${wide?"680px":"520px"}">${html}</div>`;
  thread.appendChild(t);scroll();return t}
function addSaid(text){const t=el("div","said",text);thread.appendChild(t);scroll();return t}
function addTyping(){const t=el("div","turn");
  t.innerHTML=`<span class="av">${SPARK}</span><div class="ask"><span class="typing"><i></i><i></i><i></i></span></div>`;
  thread.appendChild(t);scroll();return t}

function renderSummary(){
  $("#summary").innerHTML=`<div class="sum done">
      <span class="k">${STORE_PROFILE.label}</span>
      <span class="t-sm med">${STORE_PROFILE.sum}</span>
      <span class="t-xs" style="color:var(--content-success-default)">Inferred from connected data</span></div>`
    +STEPS.map((s,i)=>{
    const state=i<step?"done":i===step?"now":"";
    const val=said[s.k]?said[s.k]:(i===step?"Answering now…":"Not set yet");
    return `<div class="sum ${state}">
      <span class="k">${s.label}</span>
      <span class="t-sm ${i<step?"med":"ter"}">${val}</span></div>`}).join("")
    + (step>=STEPS.length?`<button class="btn btn-primary" style="margin-top:var(--sm)" onclick="location.href='index.html'">Open the Engagement Center</button>`:"");
}
function renderStep(){
  const s=STEPS[step];
  $("#stepLabel").textContent=`Step ${step+1} of ${STEPS.length} · ${s.label}`;
  $("#bar").style.width=((step+1)/STEPS.length*100)+"%";
  chips.innerHTML=s.chips.map((c,i)=>`<button class="chip ${i===s.recommended?"recommended":""}" data-choice="${i}"
      aria-label="${c}${i===s.recommended?", recommended":""}">
      ${i===s.recommended?`<span class="recMark" aria-hidden="true">★ Recommended</span>`:""}<span>${c}</span></button>`).join("");
  $$(".chip",chips).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.choice;
    $("#say").value = i===s.recommended ? s.answer : s.chips[i];
    $("#say").focus();
  }));
  $("#hint").textContent=s.hint;
  $("#say").value="";
  let educationTurn=null;
  if(s.before){
    addAsk("Before you choose a level of autonomy, here's the whole ACE decision in 72 seconds.");
    educationTurn=addAssistantCard(s.before(),true);
  }
  addAsk(s.ask);
  if(educationTurn) setTimeout(()=>educationTurn.scrollIntoView({behavior:"smooth",block:"start"}),80);
  renderSummary();
}

const ACE_TOUR_COPY=[
  "ACE continuously reads the signals already in your stack.",
  "It looks for a useful customer moment — not a reason to send more.",
  "It decides whether this shopper should hear from you, and when.",
  "It writes a one-to-one conversation from your skills and context.",
  "Consent, exclusions, timing, frequency and offers are checked every time.",
  "The message sends automatically or waits for approval — you choose."
];
let aceTourTimer=null,aceTourIndex=-1;
function aceTourIcon(kind){return kind==="pause"
  ?`<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>`
  :`<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2.2v11.6L13 8z"/></svg>`}
function toggleAceTour(btn){
  if(aceTourTimer){
    clearInterval(aceTourTimer);aceTourTimer=null;btn.innerHTML=aceTourIcon("play");
    btn.setAttribute("aria-label","Resume ACE overview");btn.title="Resume ACE overview";return;
  }
  if(aceTourIndex>=ACE_TOUR_COPY.length-1){
    aceTourIndex=-1;
    $$("[data-ace-node]").forEach(n=>n.classList.remove("active","done"));
    $("#aceVideoProgress").style.width="0";$("#aceVideoTime").textContent="0:00 / 1:12";
  }
  btn.innerHTML=aceTourIcon("pause");btn.setAttribute("aria-label","Pause ACE overview");btn.title="Pause ACE overview";
  const advance=()=>{
    aceTourIndex++;
    const nodes=$$("[data-ace-node]");
    nodes.forEach((n,i)=>{n.classList.toggle("done",i<aceTourIndex);n.classList.toggle("active",i===aceTourIndex)});
    $("#aceVideoTitle").textContent=ACE_TOUR_COPY[aceTourIndex];
    $("#aceVideoProgress").style.width=((aceTourIndex+1)/ACE_TOUR_COPY.length*100)+"%";
    const seconds=(aceTourIndex+1)*12;
    $("#aceVideoTime").textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")} / 1:12`;
    if(aceTourIndex===ACE_TOUR_COPY.length-1){
      clearInterval(aceTourTimer);aceTourTimer=null;
      nodes.forEach(n=>{n.classList.remove("active");n.classList.add("done")});
      btn.innerHTML=aceTourIcon("play");btn.setAttribute("aria-label","Replay ACE overview");btn.title="Replay ACE overview";
    }
  };
  advance();
  if(aceTourIndex<ACE_TOUR_COPY.length-1) aceTourTimer=setInterval(advance,800);
}
function answer(){
  const v=$("#say").value.trim(); if(!v) return;
  const s=STEPS[step];
  addSaid(v);
  said[s.k]=s.sum[1];
  $("#say").value=""; chips.innerHTML=""; $("#send").disabled=true;
  const typing=addTyping();
  setTimeout(()=>{
    typing.remove();
    addAsk(s.ack);
    addAssistantCard(s.card());
    step++; $("#send").disabled=false;
    renderSummary();
    if(step<STEPS.length) setTimeout(()=>{renderStep();scroll()},550);
    else finish();
  },780);
}
function finish(){
  $("#stepLabel").textContent="Setup complete";
  $("#bar").style.width="100%";
  $("#compose").classList.add("hidden");
  setTimeout(()=>{
    addAsk(`That's everything. Your Engagement Center is set up and ACE is on manual acceptance, so nothing sends without you.<br><br>
      Based on what I can already see, the first thing I'd look at is the gap between day 48 and day 58 after a first order — 1,240 shoppers are sitting in it right now, and nothing you run touches them.`);
    const t=el("div","turn");
    t.innerHTML=`<span class="av" style="opacity:0"></span><div style="flex:1;max-width:520px">
      <div class="card" style="border-color:var(--purple-200);background:linear-gradient(140deg,var(--purple-50),transparent 70%)">
        <span class="h-md">Ready to go</span>
        <p class="t-sm sec" style="margin:var(--xxs) 0 var(--sm)">Nothing has been sent. Everything below is editable.</p>
        <div class="col gap-xxs">
          <div class="row between"><span class="t-sm sec">${STORE_PROFILE.label}</span>
            <span class="t-sm med" style="text-align:right;max-width:60%">${STORE_PROFILE.sum}</span></div>
          ${STEPS.map(s=>`<div class="row between"><span class="t-sm sec">${s.label}</span>
            <span class="t-sm med" style="text-align:right;max-width:60%">${s.sum[1]}</span></div>`).join("")}
        </div>
        <div class="row gap-xs" style="margin-top:var(--md)">
          <button class="btn btn-primary" onclick="location.href='index.html'">Open the Engagement Center</button>
          <button class="btn btn-secondary" onclick="location.reload()">Start over</button>
        </div>
      </div></div>`;
    thread.appendChild(t); scroll(); renderSummary();
  },500);
}

$("#send").addEventListener("click",answer);
document.addEventListener("click",e=>{
  const play=e.target.closest("[data-ace-video]");
  if(play) toggleAceTour(play);
});
$("#voice").addEventListener("click",()=>{
  const b=$("#voice"), input=$("#say"), s=STEPS[step];
  b.classList.add("listening");b.title="Listening…";input.placeholder="Listening…";
  setTimeout(()=>{input.value=s.answer;b.classList.remove("listening");b.title="Answer by voice";input.placeholder="Type or speak your answer…";input.focus()},900);
});
$("#say").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();answer()}
});
$("#say").addEventListener("input",e=>{
  e.target.style.height="auto"; e.target.style.height=Math.min(140,e.target.scrollHeight)+"px";
});
$("#skip").addEventListener("click",()=>location.href="index.html");

addAsk(`Hello — I'm the agent that's going to be talking to your shoppers.<br><br>
  I've already read your Shopify catalogue, 18 months of orders and 12,400 Gorgias conversations. I won't ask you to repeat what your systems already know. I'll show you what I inferred, then ask only for the six decisions that need your judgement — under three minutes.`);
addAssistantCard(storeProfileCard());
setTimeout(renderStep,900);
</script>
